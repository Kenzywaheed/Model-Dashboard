  <script>
    // Data from dummy.js
    const dummyData = {
      localBrands: ['Be More', 'Avelle', 'Spark', 'Ruhdies', 'Juvo', 'Groomi', 'CFB', 'Milvus.co', 'atypicalstudios', 'Yours', 'TAJ SISTERS', 'Fragile'],
      reviewsData: [4, 3, 4, 4, 5, 4],
      // ... full data hardcoded
      chartData1: {
        labels: ['12am', '6am', '12pm', '6pm', '11pm'],
        data: [1200, 2400, 8900, 3400, 6700]
      },
      chartData2: {
        labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
        data: [12500, 18200, 16700, 23400, 19800, 24500, 25700]
      }
    };

    // Charts
    let chart1, chart2;
    function createCharts() {
      const isDark = document.documentElement.classList.contains('dark');
      const bg = isDark ? '#1e293b' : 'rgba(255,255,255,0.9)';
      const grid = isDark ? 'rgba(148,163,184,0.2)' : 'rgba(148,163,184,0.3)';
      const text = isDark ? '#94a3b8' : '#64748b';

      // Chart 1 - Today Orders
      chart1?.destroy();
      chart1 = new Chart(document.getElementById('chart1'), {
        type: 'line',
        data: {
          labels: dummyData.chartData1.labels,
          datasets: [{
            data: dummyData.chartData1.data,
            borderColor: isDark ? '#a5b4fc' : '#6366f1',
            backgroundColor: (ctx) => {
              const gradient = ctx.chart.ctx.createLinearGradient(0, 0, 0, 200);
              gradient.addColorStop(0, isDark ? 'rgba(165,180,252,0.3)' : 'rgba(99,102,241,0.3)');
              gradient.addColorStop(1, 'transparent');
              return gradient;
            },
            tension: 0.4,
            fill: true,
            pointRadius: 6,
            pointHoverRadius: 8
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: grid }, ticks: { color: text } },
            y: { grid: { color: grid }, ticks: { color: text } }
          }
        }
      });

      // Chart 2 - Weekly
      chart2?.destroy();
      chart2 = new Chart(document.getElementById('chart2'), {
        type: 'line',
        data: {
          labels: dummyData.chartData2.labels,
          datasets: [{
            data: dummyData.chartData2.data,
            borderColor: isDark ? '#34d399' : '#10b981',
            backgroundColor: (ctx) => {
              const gradient = ctx.chart.ctx.createLinearGradient(0, 0, 0, 200);
              gradient.addColorStop(0, isDark ? 'rgba(52,211,153,0.3)' : 'rgba(16,185,129,0.3)');
              gradient.addColorStop(1, 'transparent');
              return gradient;
            },
            tension: 0.4,
            fill: true,
            pointRadius: 6,
            pointHoverRadius: 8
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: grid }, ticks: { color: text } },
            y: { grid: { color: grid }, ticks: { color: text } }
          }
        }
      });
    }

    // Init charts
    createCharts();

    // Theme logic (exact from ThemeContext)
    const themeToggle = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    const themeLabel = document.getElementById('theme-label');
    const themeSwitch = document.getElementById('theme-switch');
    
    function loadTheme() {
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = saved === 'dark' || (!saved && prefersDark);
      if (isDark) {
        document.documentElement.classList.add('dark');
        themeIcon.textContent = '☀️';
        themeLabel.textContent = 'Light Mode';
        themeSwitch.classList.remove('justify-start');
        themeSwitch.classList.add('justify-end', 'bg-indigo-500');
      }
    }
    loadTheme();

    themeToggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      themeIcon.textContent = isDark ? '☀️' : '🌙';
      themeLabel.textContent = isDark ? 'Light Mode' : 'Dark Mode';
      themeSwitch.classList.toggle('justify-start');
      themeSwitch.classList.toggle('justify-end', 'bg-indigo-500');
      createCharts(); // Redraw charts
    });

    // Navigation
    const navButtons = document.querySelectorAll('[data-page]');
    const pages = document.querySelectorAll('.page');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const hamburger = document.getElementById('hamburger');
    
    function showPage(pageId) {
      pages.forEach(p => p.classList.add('hidden'));
      document.getElementById(pageId).classList.remove('hidden');
      
      document.querySelectorAll('.sidebar-nav-item-active').forEach(el => el.classList.remove('sidebar-nav-item-active'));
      document.querySelector(`[data-page="${pageId}"]`).classList.add('sidebar-nav-item-active');
      
      if (window.innerWidth < 1024) sidebar.classList.add('-translate-x-full');
      overlay.classList.add('hidden');
    }

    navButtons.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        showPage(btn.dataset.page);
      });
    });

    // Mobile hamburger
    hamburger.addEventListener('click', () => {
      sidebar.classList.remove('-translate-x-full');
      overlay.classList.remove('hidden');
    });
    overlay.addEventListener('click', () => {
      sidebar.classList.add('-translate-x-full');
      overlay.classList.add('hidden');
    });

    // Close sidebar on resize
    window.addEventListener('resize', () => {
      if (window.innerWidth >= 1024) {
        sidebar.classList.remove('-translate-x-full');
        overlay.classList.add('hidden');
      }
    });

    // Initial page
    showPage('dashboard');
  </script>
</body>
</html>
