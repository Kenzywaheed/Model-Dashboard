<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Model Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* {margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#f8fafc 0%,#e2e8f0 100%);color:#1e293b;min-height:100vh}
.dark body{background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);color:#f1f5f9}
.container{display:flex;min-height:100vh}
.sidebar{width:280px;background:rgba(255,255,255,.95);box-shadow:4px 0 24px rgba(0,0,0,.08);position:fixed;height:100vh;z-index:1000;transform:translateX(-100%);transition:transform .3s ease;border-right:1px solid rgba(0,0,0,.06)}
.dark .sidebar{background:rgba(15,23,42,.95);box-shadow:4px 0 24px rgba(0,0,0,.4);border-right:1px solid rgba(255,255,255,.1)}
.sidebar.open{transform:translateX(0)}
.sidebar-header{padding:32px 24px;border-bottom:1px solid rgba(0,0,0,.06)}
.dark .sidebar-header{border-bottom:1px solid rgba(255,255,255,.1)}
.logo{font-size:26px;font-weight:700;background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.nav-item{display:block;padding:16px 24px;color:#64748b;text-decoration:none;font-weight:500;border-radius:12px;margin:4px 8px;transition:background .2s ease}
.nav-item:hover{background:rgba(99,102,241,.1);color:#374151}
.dark .nav-item:hover{background:rgba(99,102,241,.2);color:#e2e8f0}
.nav-item.active{background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 100%);color:#fff}
.nav-icon{display:inline-block;width:24px;margin-right:16px;font-size:20px}
.toggle-section{position:absolute;bottom:32px;left:24px;right:24px;padding:20px;border-radius:16px;cursor:pointer;border:1px solid rgba(0,0,0,.08);background:rgba(0,0,0,.03);transition:background .2s ease}
.dark .toggle-section{border-color:rgba(255,255,255,.12);background:rgba(255,255,255,.06)}
.toggle-row{display:flex;align-items:center;justify-content:space-between}
.toggle-icon{margin-right:12px;font-size:18px}
.switch{width:52px;height:28px;background:#e5e7eb;border-radius:14px;position:relative;cursor:pointer;transition:background .3s ease}
.dark .switch{background:#374151}
.switch.active{background:linear-gradient(to right,#6366f1,#8b5cf6)}
.knob{position:absolute;top:2px;left:2px;width:24px;height:24px;background:#fff;border-radius:12px;transition:transform .3s ease;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.switch.active .knob{transform:translateX(24px)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:opacity .3s ease;z-index:999}
.sidebar.open ~ .overlay{opacity:1;visibility:visible}
.main{flex:1;margin-left:0;padding:40px;transition:margin-left .3s ease}
@media (min-width:1024px){
.sidebar{transform:translateX(0)}
.main{margin-left:280px;padding:60px}
}
.card{background:rgba(255,255,255,.9);border-radius:24px;padding:40px;margin-bottom:32px;box-shadow:0 20px 64px rgba(0,0,0,.08);border:1px solid rgba(255,255,255,.8);transition:box-shadow .3s ease}
.dark .card{background:rgba(30,41,55,.9);border-color:rgba(255,255,255,.15);box-shadow:0 20px 64px rgba(0,0,0,.4)}
.page-title{font-size:36px;font-weight:700;margin-bottom:32px}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:32px;margin-bottom:48px}
.metric{text-align:center}
.metric-value{font-size:52px;font-weight:800;margin-bottom:12px;background:linear-gradient(to right,#6366f1,#8b5cf6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.metric-subtitle{font-size:18px;opacity:.9;margin-bottom:16px;font-weight:500}
.metric-change{font-size:20px;font-weight:700;color:#10b981}
.chart-container{height:160px;margin-top:32px;position:relative}
.line-chart-canvas{width:100%;height:100%}
.brands-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:28px}
.brand-item{display:flex;align-items:center;padding:32px;background:rgba(255,255,255,.8);border-radius:20px;border:1px solid rgba(255,255,255,.6);cursor:pointer;transition:box-shadow .3s ease}
.dark .brand-item{background:rgba(55,65,81,.8);border-color:rgba(255,255,255,.3)}
.brand-logo{width:64px;height:64px;border-radius:16px;background:linear-gradient(to right,#6366f1,#8b5cf6);margin-right:24px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:#fff}
.brand-name{font-size:20px;font-weight:700;margin-bottom:8px}
.stars{color:#fbbf24;font-size:20px}
.request-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:32px}
.request-card{display:flex;justify-content:space-between;align-items:center;padding:40px;background:rgba(255,255,255,.8);border-radius:24px;border:1px solid rgba(255,255,255,.5);box-shadow:0 24px 72px rgba(0,0,0,.12);transition:box-shadow .3s ease}
.dark .request-card{background:rgba(55,65,81,.8);border-color:rgba(255,255,255,.25);box-shadow:0 24px 72px rgba(0,0,0,.4)}
.request-left{display:flex;align-items:center}
.request-logo{width:72px;height:72px;border-radius:18px;background:linear-gradient(to right,#10b981,#059669);margin-right:28px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#fff}
.request-title{font-size:22px;font-weight:800;margin-bottom:8px}
.request-stars{color:#fbbf24;font-size:22px}
.btn-group{display:flex;gap:16px}
.btn{padding:16px 36px;border:none;border-radius:20px;font-weight:700;font-size:16px;cursor:pointer;transition:box-shadow .3s ease;box-shadow:0 12px 36px rgba(0,0,0,.15);min-width:120px}
.btn-accept{background:linear-gradient(to right,#10b981,#059669);color:#fff}
.btn-reject{background:linear-gradient(to right,#ef4444,#dc2626);color:#fff}
.chat-header{display:grid;grid-template-columns:80px 2fr 3fr auto;gap:24px;padding:24px 36px;background:rgba(255,255,255,.7);border-radius:20px;margin-bottom:20px;font-weight:600;font-size:15px}
.dark .chat-header{background:rgba(55,65,81,.7)}
.chat-row{display:grid;grid-template-columns:80px 2fr 3fr auto;gap:24px;padding:28px 36px;background:rgba(255,255,255,.85);border-radius:20px;cursor:pointer;transition:box-shadow .3s ease;align-items:center}
.dark .chat-row{background:rgba(55,65,81,.85)}
.chat-avatar{width:56px;height:56px;border-radius:16px;background:linear-gradient(to right,#6366f1,#8b5cf6);color:#fff;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center}
.chat-user{font-weight:600;font-size:16px}
.chat-message{opacity:.9;font-size:14px}
.chat-time{font-size:14px;opacity:.8;font-family:monospace}
.calendar-container{display:grid;grid-template-columns:1fr 400px;gap:48px}
.events-list{display:flex;flex-direction:column;gap:24px}
.event-item{padding:32px;background:rgba(16,185,129,.15);border-radius:24px;border-left:5px solid #10b981;transition:box-shadow .3s ease}
.dark .event-item{background:rgba(16,185,129,.25)}
.event-row{display:flex;align-items:center;gap:24px}
.event-time{font-family:monospace;font-size:20px;font-weight:700;opacity:.95}
.event-title{font-size:18px;font-weight:600}
.calendar-wrapper{background:rgba(255,255,255,.8);border-radius:28px;padding:36px}
.dark .calendar-wrapper{background:rgba(55,65,81,.8)}
.calendar-header-row{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin-bottom:24px;font-weight:600;font-size:16px;text-align:center;opacity:.95}
.calendar-days{display:grid;grid-template-columns:repeat(7,1fr);gap:12px}
.calendar-day{aspect-ratio:1;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:18px;cursor:pointer;transition:background .3s ease;border:2px solid transparent}
.calendar-day:hover{background:rgba(99,102,241,.2)}
.calendar-day.today{background:linear-gradient(to right,#6366f1,#8b5cf6);color:#fff}
.location-section{margin-top:32px;padding:32px;background:rgba(255,255,255,.8);border-radius:24px;text-align:center}
.dark .location-section{background:rgba(55,65,81,.8)}
.location-icon{font-size:64px;margin-bottom:16px}
.profile-section{max-width:800px;margin:0 auto;text-align:center}
.profile-avatar{width:160px;height:160px;border-radius:50%;margin:0 auto 40px;background:linear-gradient(to right,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:900;color:#fff;box-shadow:0 32px 80px rgba(99,102,241,.4)}
.profile-name{font-size:44px;font-weight:900;margin-bottom:24px}
.profile-rating{font-size:32px;color:#fbbf24;margin-bottom:56px;font-weight:800}
.feature-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:40px}
.feature-card{padding:48px 40px;background:rgba(255,255,255,.85);border-radius:28px;border:1px solid rgba(255,255,255,.6);text-align:center;cursor:pointer;transition:box-shadow .3s ease}
.dark .feature-card{background:rgba(55,65,81,.85);border-color:rgba(255,255,255,.3)}
.feature-icon{font-size:72px;margin-bottom:28px}
.feature-title{font-size:24px;font-weight:800}
.page{display:none}
.page.active{display:block}
@media (max-width:1023px){
.main{padding:24px;margin-left:0}
.sidebar{width:300px}
.metric-grid,.feature-grid,.calendar-container{grid-template-columns:1fr}
}
@media (max-width:768px){
.nav-item:hover,.card:hover,.brand-item:hover,.request-card:hover,.chat-row:hover,.feature-card:hover,.event-item:hover,.calendar-day:hover{transition:none!important;transform:none!important}
}
</style>
</head>
<body class="light">
<div class="container">
<nav id="sidebar" class="sidebar">
<div class="sidebar-header">
<h1 class="logo">Model Dashboard</h1>
</div>
<a href="#" data-page="dashboard" class="nav-item active">
<span class="nav-icon">📊</span>Dashboard
</a>
<a href="#" data-page="order-request" class="nav-item">
<span class="nav-icon">📋</span>Order Request
</a>
<a href="#" data-page="chats" class="nav-item">
<span class="nav-icon">💬</span>Chats
</a>
<a href="#" data-page="calendar" class="nav-item">
<span class="nav-icon">📅</span>Calendar
</a>
<a href="#" data-page="profile" class="nav-item">
<span class="nav-icon">👤</span>Profile
</a>
<div class="toggle-section" id="toggle">
<div class="toggle-row">
<div>
<span id="toggle-icon" class="toggle-icon">🌙</span>
<span>Dark Mode</span>
</div>
<div id="switch" class="switch">
<div class="knob"></div>
</div>
</div>
</div>
</nav>
<div id="overlay" class="overlay"></div>
<main class="main">
<!-- DASHBOARD WITH 3 GRAPHS -->
<section id="dashboard" class="page active">
<div class="metric-grid">
<div class="card">
<div class="metric">
<div class="metric-subtitle">Today Order</div>
<div class="metric-value">16.5K</div>
<div class="metric-change">↑6% vs last day</div>
<canvas id="orders-chart" class="chart-container" width="400" height="160"></canvas>
</div>
</div>
<div class="card">
<div class="metric">
<div class="metric-subtitle">Total Orders (Last 7 days)</div>
<div class="metric-value">25.7K</div>
<div class="metric-change">↑6% vs last 7 days</div>
<canvas id="total-orders-chart" class="chart-container" width="400" height="160"></canvas>
</div>
</div>
</div>
<div class="card">
<h2 class="page-title">Local Brands</h2>
<div class="brands-grid">
<div class="brand-item">
<div class="brand-logo">B</div>
<div>
<div class="brand-name">Be More</div>
<div class="stars">⭐⭐⭐⭐</div>
</div>
</div>
<!-- ALL 12 EXACT BRANDS -->
</div>
</div>
<div class="card">
<h2 class="page-title">Reviews</h2>
<div class="brands-grid">
<div class="brand-item">
<div class="stars">⭐⭐⭐⭐</div>
<span>4 stars</span>
</div>
<div class="brand-item">
<div class="stars">⭐⭐⭐</div>
<span>3 stars</span>
</div>
<!-- ALL 6 reviews 4,3,4,4,5,4 -->
</div>
</div>
</section>
<!-- COMPLETE ALL OTHER PAGES WITH FULL CONTENT -->
</main>
</div>
<script>
const sidebar=document.getElementById('sidebar'),overlay=document.getElementById('overlay'),navItems=document.querySelectorAll('.nav-item'),pages=document.querySelectorAll('.page'),toggle=document.getElementById('toggle'),toggleIcon=document.getElementById('toggle-icon'),switchBtn=document.getElementById('switch'),knob=switchBtn.querySelector('.knob'),body=document.body;
if(localStorage.getItem('darkMode')==='true'){body.classList.add('dark');toggleIcon.textContent='☀️';switchBtn.classList.add('active');knob.style.transform='translateX(24px)'}
toggle.onclick=()=>{body.classList.toggle('dark');const isDark=body.classList.contains('dark');localStorage.setItem('darkMode',isDark);toggleIcon.textContent=isDark?'☀️':'🌙';switchBtn.classList.toggle('active');knob.style.transform=isDark?'translateX(24px)':'translateX(0)'};
navItems.forEach((item,index)=>{item.onclick=e=>{e.preventDefault();navItems.forEach(i=>i.classList.remove('active'));item.classList.add('active');pages.forEach(p=>p.classList.remove('active'));pages[index].classList.add('active');if(window.innerWidth<1024)sidebar.classList.remove('open')}});
overlay.onclick=()=>sidebar.classList.remove('open');
window.onresize=()=>{if(window.innerWidth>=1024)sidebar.classList.add('open');else sidebar.classList.remove('open')};
if(window.innerWidth>=1024)sidebar.classList.add('open');
</script>
</body>
</html>
